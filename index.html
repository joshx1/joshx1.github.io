<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>John | Linktree</title>
    <!-- Font Awesome icons -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.8.1/css/all.css">
    <!-- Core theme CSS -->
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <!-- Parallax Pixel Background Animation -->
    <section class="animated-background">
      <div id="stars1"></div>
      <div id="stars2"></div>
      <div id="stars3"></div>
    </section>
    <!-- End of Parallax Pixel Background Animation -->

    <div class="overlay" id="popup">
      <div class="popup">
        <div id="links">
          <a class="link" href="https://github.com/joshx1" target="_blank">
            <i class="fab fa-github">&nbsp;</i>Github
          </a>
          <a class="link" href="https://www.linkedin.com/in/josh-x-li/" target="_blank">
            <i class="fab fa-linkedin">&nbsp;</i>Linkedin
          </a>
        </div>
        <a class="popup-close" onclick="history.back()">&times;</a>
      </div>
    </div>

    <div id="userName">
      Josh
    </div>


  </body>
</html>
